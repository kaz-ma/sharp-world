<div id="app">
  <noscript><p style="color:#fff;padding:20px">このゲームは JavaScript が ひつようです。</p></noscript>
  <div id="stage"><canvas id="c" width="640" height="360"></canvas></div>
  <div id="touch"></div>
  <div id="stick" class="hidden"><i></i></div>
  <button id="btnM" type="button" aria-label="メニュー">メニュー</button>
  <button id="btnB" type="button" aria-label="はしる(おすたびに きりかえ)・もどる">B<small>はしる</small></button>
  <button id="btnA" type="button" aria-label="けってい">A<small>はなす</small></button>
  <div id="xfer" class="hidden"><div class="xbox"><p id="xtitle"></p><textarea id="xta" rows="6" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea><div class="xrow"><button id="xcopy" type="button">コピー</button><button id="xok" type="button">よみこむ</button><button id="xclose" type="button">とじる</button></div><p id="xmsg"></p></div></div>
  <div id="rotate"><div class="rot-card"><div class="phone"></div><p>スマホを<b>よこむき</b>にしてね</p></div></div>
</div>
