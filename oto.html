<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>音の聴き比べ</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #10132a; color: #f7f1e6; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif; padding: 18px 16px calc(40px + env(safe-area-inset-bottom)); }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; } p { margin: 0 0 14px; font-size: 13px; line-height: 1.7; color: #c9bfdc; }
  article { border: 2px solid #4a456d; border-radius: 14px; padding: 12px 14px; margin: 0 0 12px; background: #191b38; }
  article.on { border-color: #ffd08a; background: #262546; }
  h2 { font-size: 17px; margin: 0 0 4px; } article p { margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button, a.btn { flex: 1 1 140px; min-height: 46px; border-radius: 10px; border: 2px solid #8d849a; background: #e8e2ee; color: #2b2540; font-weight: 700; font-size: 15px; line-height: 1.2; font-family: inherit; display: flex; align-items: center; justify-content: center; text-decoration: none; padding: 6px; }
  a.btn { background: transparent; color: #f7f1e6; }
  button.stop { position: sticky; bottom: 12px; width: 100%; background: #c25a62; color: #fff; border-color: #f2e6d2; }
  #warn { color: #ffb3a8; font-weight: 700; }
</style>
<main>
  <h1>音の聴き比べ</h1>
  <p>「オープニング」は、タップの音 → コマが5枚出る音 → 題字の音 → タイトルの曲、の順に流れます。<br>音が出ないときは、スマホの消音(マナーモード)と音量を確認してください。</p>
  <p id="warn"></p>
  <div id="list"></div>
  <button class="stop" id="stop" type="button">とめる</button>
</main>
<script src="audio.js?v=mwvhflog"></script>
<script>
const SETS = [['pick', '★ いま ゲームで使っている音', '最初のタップは オルゴール。そのあと(コマ・題字・曲)は 90年代アニメ。'], ['now', '0 はじめの音', '鈴と低い和音。静かな曲。'], ['a', '1 オルゴール', '小さな箱のオルゴール。3拍子で、なつかしい感じ。'], ['b', '2 90年代アニメ', 'ドラムとシンセ。アニメの始まりのような、勢いのある感じ。'],
  ['c', '3 雨とピアノ', '雨の音と、ゆっくりしたピアノ。いちばん寂しく、落ち着いた感じ。'], ['d', '4 電子の灯り', '近未来の電子音。広がりと、こだまがある感じ。'], ['e', '5 和の夕暮れ', 'こと・風鈴・太鼓。日本の夕方のような感じ。']];
let timers = [];
const later = (sec, fn) => timers.push(setTimeout(fn, sec * 1000));
function stop() { timers.forEach(clearTimeout); timers = []; Aud.bgm(null); document.querySelectorAll('article').forEach((e) => e.classList.remove('on')); }
function play(k, card, songOnly) {
  Aud.unlock(); stop(); card.classList.add('on'); Aud.setTheme(k);
  if (songOnly) { Aud.bgm('title'); return; }
  Aud.sfx('opStart');
  const s = 0.8; // タップしてから コマが出はじめるまで
  for (let i = 0; i < 5; i++) later(s + 0.35 + i * 0.5, () => Aud.sfx('opPanel', i));
  later(s + 3.15, () => Aud.sfx('opTitle'));
  later(s + 6.2, () => Aud.bgm('title'));
}
for (const [k, name, desc] of SETS) {
  const card = document.createElement('article');
  card.innerHTML = `<h2>${name}</h2><p>${desc}</p><div class="row"><button type="button" data-op>オープニング</button><button type="button" data-song>曲だけ</button><a class="btn" href="./index.html${k === 'pick' ? '' : '?oto=' + k}">絵と一緒に見る</a></div>`;
  card.querySelector('[data-op]').onclick = () => play(k, card, false);
  card.querySelector('[data-song]').onclick = () => play(k, card, true);
  document.getElementById('list').appendChild(card);
}
document.getElementById('stop').onclick = stop;
if (Aud.muted) { Aud.setMute(false); document.getElementById('warn').textContent = 'ゲームの「おと」が「なし」になっていたので、「あり」にしました。'; }
</script>
</html>
